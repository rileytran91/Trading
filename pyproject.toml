[project]
name = "capitalflow-backtest"
version = "1.0.0"
description = "Crypto Capital Flow Backtest System - Leading indicator analysis for market cycle detection"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.28",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
run-backtest = "scripts.run_backtest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
